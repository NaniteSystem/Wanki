name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM modules)
        run: ./gradlew :core:scoring:test :core:ink:test --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanki-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7
          - device: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch test-failed
            adb pull /sdcard/Android/data/app.wanki/files/screens screens || true
            adb logcat -d > logcat.txt || true
            test ! -f test-failed

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-${{ matrix.device }}
          path: |
            screens/
            logcat.txt
            app/build/reports/androidTests/
          retention-days: 14

      # Artifacts are not reachable from every environment, so screenshots, the filtered logcat and
      # test results are also pushed to a throwaway branch per device (force-pushed every run).
      - name: Publish screenshots to a branch
        if: always() && github.event_name == 'push'
        run: |
          out=/tmp/pub/${{ matrix.device }}
          mkdir -p "$out"
          cp -r screens/. "$out"/ 2>/dev/null || true
          grep -E "AndroidRuntime|FATAL EXCEPTION|WankiInk|TestRunner|System.err" logcat.txt | tail -n 400 > "$out/logcat-filtered.txt" || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec cp {} "$out"/ \; 2>/dev/null || true
          echo "${{ github.sha }}" > "$out/commit.txt"
          cd /tmp/pub
          git init -q
          git checkout -q -b ci-screenshots-${{ matrix.device }}
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Emulator screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-screenshots-${{ matrix.device }}
